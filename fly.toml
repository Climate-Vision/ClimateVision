app = 'climatevision-green'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'climatevision_data'
  destination = '/app/outputs'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[env]
  PYTHONUNBUFFERED = '1'
  OMP_NUM_THREADS = '1'
  DATABASE_URL = 'sqlite:///app/outputs/climatevision.sqlite3'
