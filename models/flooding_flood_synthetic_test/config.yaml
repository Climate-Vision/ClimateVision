analysis:
  type: flooding
data:
  batch_size: 2
  dir: data/processed/flood
  image_size: 256
  num_workers: 4
  pin_memory: true
  use_weighted_sampler: true
loss:
  focal_alpha: 0.25
  focal_gamma: 2.0
  focal_weight: 0.5
  type: combined
  use_class_weights: true
model:
  architecture: flood_unet_s2only
  bilinear: true
  encoder: efficientnet-b7
  in_channels: 3
  num_classes: 3
normalizer_stats: ''
optimizer:
  learning_rate: 0.0001
  min_lr: 1.0e-06
  weight_decay: 0.0001
output:
  run_name: flood_synthetic_test
  save_dir: models
schedule:
  checkpoint_interval: 5
  epochs: 5
  warmup_epochs: 3
training:
  early_stopping_patience: 10
  ema_decay: 0.99
  grad_clip: 1.0
  mixed_precision: false
  use_ema: true
